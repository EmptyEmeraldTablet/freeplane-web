<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <title>Notes · Freeplane Web Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">◈</span>
          <div>
            <div class="brand-title">Notes</div>
            <div class="brand-sub">Freeplane 只读视图</div>
          </div>
        </div>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="搜索节点…  (/) " autocomplete="off" />
          <div class="search-results" id="searchResults" hidden></div>
        </div>
        <nav class="map-list" id="mapList"></nav>
        <div class="sidebar-foot" id="mapStats"></div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main">
        <header class="toolbar">
          <button class="icon-btn" id="toggleSidebar" title="切换侧栏" aria-label="切换侧栏">☰</button>
          <div class="crumbs" id="crumbs"></div>
          <div class="spacer"></div>
          <div class="seg" id="depthSeg" title="展开层级">
            <button data-depth="1">1</button>
            <button data-depth="2" class="on">2</button>
            <button data-depth="3">3</button>
            <button data-depth="-1">全部</button>
          </div>
          <button class="icon-btn" id="btnFit" title="适应窗口" aria-label="适应窗口">⤢</button>
          <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">◐</button>
        </header>

        <div class="canvas" id="canvas">
          <svg id="mindmap"></svg>
          <div class="hint" id="hint">滚轮缩放 · 拖拽平移 · 点击圆点折叠 · 点击节点看详情</div>
          <div class="canvas-tools">
            <button class="tool-btn" id="btnZoomIn" title="放大" aria-label="放大">＋</button>
            <button class="tool-btn" id="btnZoomOut" title="缩小" aria-label="缩小">－</button>
          </div>
        </div>

        <aside class="detail" id="detail" hidden>
          <div class="detail-head">
            <div class="detail-kicker" id="detailKicker"></div>
            <h2 id="detailTitle"></h2>
            <button class="icon-btn close" id="detailClose" title="关闭" aria-label="关闭">×</button>
          </div>
          <div class="detail-body" id="detailBody"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
